name: Update Profile README

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC (10:00 Asia/Dubai)
  push:
    branches: [main]
    paths:
      - "config.yaml"
      - "TEMPLATE.md"
      - "scripts/**"
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update script
        run: python scripts/update_readme.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md data/cache.json
          git diff --staged --quiet || git commit -m "docs: auto-update profile README [skip ci]"
          git pull --rebase origin main
          git push

      # GitHub disables scheduled workflows after 60 days without repo
      # activity. Re-enabling both through the API keeps them running even
      # when the README has nothing new to commit.
      - name: Keep scheduled workflows enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-readme.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/check-links.yml/enable"
