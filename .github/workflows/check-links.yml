name: Check links
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 403, 429 and 999 are bot blocks (Forbes, LinkedIn, X), not dead links.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept '200..=299,403,429,999' README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
