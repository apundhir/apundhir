# --- OPEN SOURCE ---
# AiExponent tools: descriptions follow aiexponent-web lib/tools.ts.
# Article titles checked at ai-act-service-desk.ec.europa.eu on 2026-10-13.
open_source:
  - name: "LitmusAI"
    repo: "aiexponent/litmusai"
    what: "Offline CLI that screens an AI system description against the EU AI Act Article 5 prohibited practices"
  - name: "RiskForge"
    repo: "aiexponent/riskforge"
    what: "Builds an audit-trailed EU AI Act Article 9 risk management file from the command line"
  - name: "RAG Benchmarking"
    repo: "aiexponent/rag-benchmarking"
    what: "Framework-agnostic evaluation harness for RAG and agentic AI systems"
  - name: "License Compliance Checker"
    repo: "aiexponent/license-compliance-checker"
    what: "License and AI model scanner for software dependencies, with SBOM output"
  - name: "Agentic Document Analyser"
    repo: "aiexponent/agentic-document-analyser"
    what: "Turns documents into structured JSON for compliance evidence, using vision-language models"
  - name: "Advanced RAG Knowledge Engine"
    repo: "apundhir/advanced_rag_knowledge_engine"
    what: "RAG and knowledge routing engine with evaluation, guardrails and observability"
  - name: "30 Days with Agents"
    repo: "apundhir/30_days_with_agents"
    what: "Free course that takes you from agent basics to advanced patterns in 30 days"

