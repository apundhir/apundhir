<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="AskAjay.ai. I help leaders make AI real.">
  <!-- AskAjay.ai GitHub profile banner (option B from the vp-design review,
       2026-10-13). AskAjay wordmark untouched ("Ask" 400 at 50%, "Ajay" 600,
       ".ai" gold); the gold in ".ai" is the frame's only accent.
       Render: scripts/render_banner.sh -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E3A5C"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#g)"/>
  <text x="88" y="88" font-family="'Clash Display', 'Arial Black', sans-serif" font-size="56" letter-spacing="-0.01em"><tspan font-weight="400" fill="#FAF7F2" fill-opacity="0.50">Ask</tspan><tspan font-weight="600" fill="#FAF7F2">Ajay</tspan><tspan font-weight="600" fill="#C9A84C">.ai</tspan></text>
  <text x="88" y="194" font-family="'Playfair Display', Georgia, serif" font-weight="400" font-size="68" fill="#FAF7F2">I help leaders</text>
  <text x="88" y="272" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="72" fill="#FAF7F2">make AI real.</text>
</svg>
